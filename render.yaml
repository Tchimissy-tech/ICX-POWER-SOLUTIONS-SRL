services:
  - type: web
    name: ICX POWER SOLUTIONS SRL
    runtime: node
    repo: https://github.com/Tchimissy-tech/ICX-POWER-SOLUTIONS-SRL
    branch: main
    region: oregon
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm drizzle-kit migrate && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: icx-power-solutions-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_APP_ID
        sync: false
      - key: OAUTH_SERVER_URL
        value: https://api.manus.im
      - key: VITE_OAUTH_PORTAL_URL
        value: https://manus.im
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: icx-power-solutions-db
    region: oregon
    plan: free
    databaseName: icx_power_solutions_db
    user: icx_power_solutions_db_user
    postgresMajorVersion: 18
